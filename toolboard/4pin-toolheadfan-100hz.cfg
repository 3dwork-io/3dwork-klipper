# Ventilador de toolhead en conector de 4 pines (100 Hz).
# Necesita el alias fan_toolhead_cooling_pin de boards/<tu-placa>/config.cfg.
# Si tu placa expone tambien el tacometro, descomenta la linea.
[heater_fan toolhead_cooling_fan]
pin: fan_toolhead_cooling_pin
# tachometer_pin: fan_toolhead_cooling_tach_pin
# tachometer_poll_interval: 0.0005
cycle_time: 0.01
