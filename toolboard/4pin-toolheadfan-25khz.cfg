# Ventilador de toolhead en conector de 4 pines (25 kHz, mas silencioso).
# Necesita los alias 4p_* de boards/<tu-placa>/config.cfg (el wizard los copia).
[heater_fan toolhead_cooling_fan]
pin: 4p_toolhead_cooling_pin
tachometer_pin: ^4p_toolhead_cooling_tach_pin
tachometer_poll_interval: 0.0005
cycle_time: 0.00004
