# Ventilador de la placa controladora en conector de 4 pines (100 Hz).
# Necesita los alias 4p_* de boards/<tu-placa>/config.cfg (el wizard los copia).
[controller_fan controller_fan]
pin: 4p_controller_board_pin
tachometer_pin: ^4p_controller_board_tach_pin
tachometer_poll_interval: 0.0005
cycle_time: 0.01
