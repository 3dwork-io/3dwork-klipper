# CHANGE_FILAMENT y utilidades relacionadas (M600/M601/NOTIFY/BEEP).
# Complementa a macros_filament_basics.cfg, que tiene el LOAD/UNLOAD asistido.
# Version activa: antes vivia en change_filament.cfg (sin prefijo macros_, que
# nadie incluia); se porto tal cual salvo las ecuaciones que ya no aplican.

[gcode_macro M600]
description: Codigo gcode para el cambio de filamento
gcode:
   CHANGE_FILAMENT

[gcode_macro M601]
description: Codigo gcode que pausa la impresion
gcode:
   PAUSE

[gcode_macro CHANGE_FILAMENT]
description: Cambio de filamento asistido (pausa + descarga + pitido)
gcode:
    PAUSE
    UNLOAD_FILAMENT
    BEEP R=3

[gcode_macro NOTIFY]
description: Envia un texto al LCD y Consola. Uso: NOTIFY TEXT="TEXTO" [CLEAR=1] (borra en 10 s)
gcode:
    {% set TEXT = params.TEXT|default("")|string %}
    {% set CLEAR = params.CLEAR|default(0)|int %}

    {% if TEXT != "" %}
        M117 {TEXT}
        {action_respond_info("%s" % (TEXT))}

        {% if CLEAR|int == 1 %}
            UPDATE_DELAYED_GCODE ID=_CLEAR_DISPLAY DURATION=10
        {% endif %}
    {% endif %}

[gcode_macro BEEP]
description: Emite un pitido. Uso: BEEP [R=NUMERO DE PITIDOS]
gcode:
    {% if 'output_pin beeper' in printer.configfile.settings %}
        {% set R = params.R|default(0)|int %}
        {% for i in range(R) %}
            M300 P200
        {% endfor %}
    {% endif %}

[delayed_gcode _CLEAR_DISPLAY]
gcode:
    M117
